spring.application.name=client_management
server.port=8010

spring.datasource.url=jdbc:mysql://localhost:1024/client_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=customer-care-system-jwt-secret-key-2026-must-be-at-least-32-bytes
app.jwt.expiration-ms=86400000

app.cors.allowed-origin=http://localhost:5173
